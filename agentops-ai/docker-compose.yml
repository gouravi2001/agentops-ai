services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://agentops:agentops@db:5432/agentops
      ENABLE_OTEL: "false"
      # OPENAI_API_KEY: set in your shell or a local untracked .env file
    depends_on:
      db: {condition: service_healthy}
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
