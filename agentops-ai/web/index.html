<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentOps AI — Incident Review</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#101c35;color:#fff;padding:22px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1120px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #e1e7f0;border-radius:12px;padding:20px;box-shadow:0 4px 18px #152a4a0a}h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 14px}button{border:0;border-radius:7px;padding:9px 13px;background:#2459d3;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e9eef8;color:#1b315d}button.danger{background:#b93838}button:disabled{opacity:.5;cursor:wait}.row{padding:14px 0;border-top:1px solid #edf0f5;cursor:pointer}.row:first-of-type{border-top:0}.pill{font-size:12px;padding:3px 8px;border-radius:20px;background:#e8eefb;color:#23498f}.critical,.high{background:#fde8e6;color:#a62823}.medium{background:#fff2d6;color:#835600}.muted{color:#66738a;font-size:13px}.actions{display:flex;gap:8px;margin-top:15px}.evidence{padding:9px;border-radius:7px;background:#f3f6fb;margin:7px 0;font-size:13px}.notice{padding:10px;background:#fff6d9;border:1px solid #ffe39a;border-radius:8px;color:#674900}.error{color:#b42318}.empty{color:#738098;padding:12px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}header{padding:18px 20px}}
</style>
</head><body><header><h1>AgentOps AI <span style="font-weight:400;color:#b5c4e5">/ Incident review</span></h1><button id="refresh">Refresh</button></header>
<main><div class="grid"><section class="panel"><h2>Pipeline incidents</h2><div id="incidents" class="muted">Loading…</div></section><section class="panel"><h2>Investigation and approval</h2><div id="detail" class="empty">Select an incident to review its evidence.</div></section></div></main>
<script>
const $=id=>document.getElementById(id);let selected=null;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw new Error((await r.json()).detail||r.statusText);return r.json()}
async function load(){try{const rows=await api('/incidents');const box=$('incidents');box.replaceChildren();if(!rows.length){box.append(el('div','No incidents yet. POST one to /incidents to begin.','empty'));return}rows.forEach(i=>{const row=el('div',undefined,'row');const top=el('div');top.style.display='flex';top.style.justifyContent='space-between';top.append(el('strong',i.pipeline));top.append(el('span',i.severity,'pill '+i.severity));row.append(top);row.append(el('div',i.summary,'muted'));row.append(el('div',i.status.replaceAll('_',' '),'muted'));row.onclick=()=>show(i.id);box.append(row)});if(selected)show(selected)}catch(e){$('incidents').textContent=e.message}}
async function show(id){selected=id;const i=await api('/incidents/'+id);const box=$('detail');box.replaceChildren();box.append(el('div',i.summary));box.append(el('p',`${i.severity.toUpperCase()} · ${i.status.replaceAll('_',' ')}`,'muted'));if(!i.investigation){const b=el('button','Investigate');b.onclick=async()=>{b.disabled=true;b.textContent='Investigating…';try{await api(`/incidents/${id}/investigate`,{method:'POST'});await load()}catch(e){$('detail').append(el('p',e.message,'error'));b.disabled=false;b.textContent='Investigate'}};box.append(b);return}
const r=i.investigation;box.append(el('h3','Likely root cause'));box.append(el('p',r.root_cause));box.append(el('p',`Confidence: ${Math.round(r.confidence*100)}% · Evidence calls: ${r.tool_calls}`,'muted'));box.append(el('h3','Evidence'));r.evidence.forEach(e=>{const card=el('div',undefined,'evidence');card.append(el('strong',`${e.id} · ${e.source}`));card.append(el('div',e.detail));box.append(card)});const rec=r.recommendation;box.append(el('h3','Suggested next step'));box.append(el('p',`${rec.action}: ${rec.rationale}`));box.append(el('div','Approval records a decision only; this demo never executes remediation.','notice'));if(i.status==='awaiting_review'){const actions=el('div',undefined,'actions');for(const d of ['approved','rejected']){const b=el('button',d==='approved'?'Approve':'Reject',d==='rejected'?'danger':'');b.onclick=async()=>{b.disabled=true;try{await api(`/incidents/${id}/decision`,{method:'POST',body:JSON.stringify({decision:d,reviewer:'demo-reviewer',comment:'Reviewed in dashboard'})});await load()}catch(e){$('detail').append(el('p',e.message,'error'))}};actions.append(b)}box.append(actions)}const audit=el('button','View audit trail','secondary');audit.style.marginTop='12px';audit.onclick=async()=>{const events=await api(`/incidents/${id}/audit`);const pre=el('pre',JSON.stringify(events,null,2));pre.style.whiteSpace='pre-wrap';box.append(pre)};box.append(audit)}
$('refresh').onclick=load;load();
</script></body></html>
